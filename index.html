<!DOCTYPE html>
<html>
<head>
<title>Travel Blog</title>
<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <header>
    <h1>Welcome to My Travel Blog!</h1>
  </header>

  <main>
    <section id="featured-posts">
      <h2>Featured Posts</h2>
      <div class="post">
        <h3>Post Title 1</h3>
        <p>Short description of post 1.</p>
        <button class="read-more">Read More</button>
      </div>
      <div class="post">
        <h3>Post Title 2</h3>
        <p>Short description of post 2.</p>
        <button class="read-more">Read More</button>
      </div>
    </section>

    <section id="categories">
      <h2>Categories</h2>
      <button class="category-button" data-category="europe">Europe</button>
      <button class="category-button" data-category="asia">Asia</button>
      <button class="category-button" data-category="north-america">North America</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 My Travel Blog</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
